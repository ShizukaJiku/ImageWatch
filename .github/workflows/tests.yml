name: Tests

# Red de seguridad de las ramas de trabajo: corre en cada pull request. **No** corre en
# push a main -allí lo cubre el job `test` de `release.yml`, sobre el commit fusionado
# exacto que se va a publicar-. Con la rama main protegida (solo se entra por PR), este
# workflow es la única puerta que hace falta antes de fusionar.
on:
  pull_request:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Formato y tests
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Dar permiso de ejecución a gradlew
        run: chmod +x gradlew

      # Checkstyle ya no está: solo analizaba Java y no queda ningún .java.
      - name: Formato (spotless)
        run: ./gradlew spotlessCheck --no-daemon

      - name: Tests
        run: ./gradlew :shared:jvmTest --no-daemon

      - name: Cobertura del núcleo (kover)
        run: ./gradlew :shared:koverVerify --no-daemon

      # `:shared:jvmTest` no compila el módulo de escritorio. Sin este paso, un fallo en
      # Main.kt / ToastWindow.kt / TitleBar.kt no se ve hasta el pipeline de release.
      - name: Compilar el módulo de escritorio
        run: ./gradlew :desktopApp:compileKotlin --no-daemon

      - name: Publicar resultados de test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: shared/build/reports/tests
          retention-days: 14
