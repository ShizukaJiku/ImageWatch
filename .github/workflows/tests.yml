name: Tests

# Corre en cada push y en cada pull request: es la red de seguridad continua,
# separada del pipeline de release para que un push a cualquier rama de
# trabajo dé feedback rápido sin depender de una etiqueta.
on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Formato y tests
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Dar permiso de ejecución a gradlew
        run: chmod +x gradlew

      # Checkstyle ya no está: solo analizaba Java y no queda ningún .java.
      - name: Formato (spotless)
        run: ./gradlew spotlessCheck --no-daemon

      - name: Tests
        run: ./gradlew :shared:jvmTest --no-daemon

      - name: Cobertura del núcleo (kover)
        run: ./gradlew :shared:koverVerify --no-daemon

      - name: Publicar resultados de test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: shared/build/reports/tests
          retention-days: 14
