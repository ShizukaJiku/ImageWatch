name: Release

# Al fusionar un PR a main (o un push directo a main). Lee `imagewatch.version` de
# gradle.properties: si su Release `vX.Y.Z` todavía no existe, empaqueta el MSI y el
# zip portable y publica el Release —creando el tag en el mismo paso—. Fusionar sin
# subir la versión no genera nada.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  test:
    name: Formato y tests
    runs-on: ubuntu-latest
    # La misma comprobación completa que `tests.yml` corre en el PR, aquí sobre el commit
    # fusionado exacto que se va a publicar -que el PR nunca vio-. Es la única corrida de
    # test en `main`: `tests.yml` ya no se dispara en push.
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Dar permiso de ejecución a gradlew
        run: chmod +x gradlew

      - name: Formato (spotless)
        run: ./gradlew spotlessCheck --no-daemon

      - name: Tests
        run: ./gradlew :shared:jvmTest --no-daemon

      - name: Cobertura del núcleo (kover)
        run: ./gradlew :shared:koverVerify --no-daemon

      - name: Compilar el módulo de escritorio
        run: ./gradlew :desktopApp:compileKotlin --no-daemon

  build:
    name: Instalador y Release
    needs: test
    # jpackage + WiX solo producen MSI en Windows: es el runner obligado.
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
      SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Decidir si hay versión nueva
        id: decide
        shell: bash
        # El tag NO se crea aquí: lo crea `gh release create` al final, cuando ya hay
        # artefactos. Así un fallo de empaquetado, de verificación o de firma no deja un
        # tag huérfano sin Release que bloquee el reintento. La guarda mira si el Release
        # ya existe -no si el tag existe-: un tag suelto sin Release se reintenta.
        run: |
          version=$(sed -n 's/^imagewatch\.version=//p' gradle.properties | tr -d '[:space:]')
          if [ -z "$version" ]; then
            echo "Falta imagewatch.version en gradle.properties" >&2
            exit 1
          fi
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "El Release v$version ya existe: nada que publicar."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Configurar JDK
        if: steps.decide.outputs.release == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configurar Gradle
        if: steps.decide.outputs.release == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Instalar WiX Toolset
        if: steps.decide.outputs.release == 'true'
        run: choco install wixtoolset -y

      - name: Empaquetar MSI y portable
        if: steps.decide.outputs.release == 'true'
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :desktopApp:packageMsi :desktopApp:packageAppImage --no-daemon

      - name: Verificar el runtime empaquetado
        if: steps.decide.outputs.release == 'true'
        shell: bash
        # Bloquea el release a propósito. El runtime que arma jlink es mínimo, y un módulo que
        # falte no lo detecta ni un test ni `packageMsi`: la aplicación instalada muere en el
        # arranque con «Failed to launch JVM» y el pipeline termina igual de verde. Ya ocurrió
        # una vez con `java.naming`, que logback necesita por reflexión y que
        # `suggestRuntimeModules` no sugiere porque jdeps no la ve.
        #
        # Comprueba la declaración, no el arranque: un smoke test de verdad exigiría ejecutar una
        # aplicación de bandeja que no termina sola. Cubre la regresión concreta que nos mordió
        # —que alguien quite un módulo de nativeDistributions— y no más.
        run: |
          archivo_release=$(find desktopApp/build/compose -type f -name release -path '*runtime*' -print -quit || true)
          if [ -z "$archivo_release" ]; then
            echo "No se encontró el archivo 'release' del runtime empaquetado." >&2
            exit 1
          fi
          echo "Runtime empaquetado ($archivo_release):"
          grep -E '^(JAVA_VERSION|OS_ARCH|MODULES)=' "$archivo_release"
          modulos=" $(grep -E '^MODULES=' "$archivo_release" | cut -d'"' -f2) "
          for modulo in java.naming java.management jdk.unsupported java.instrument; do
            case "$modulos" in
              *" $modulo "*) ;;
              *)
                echo "Falta el módulo $modulo en el runtime empaquetado." >&2
                echo "Revisa nativeDistributions.modules en desktopApp/build.gradle.kts." >&2
                exit 1
                ;;
            esac
          done

      - name: Localizar el MSI y comprimir el portable
        id: art
        if: steps.decide.outputs.release == 'true'
        shell: bash
        run: |
          msi=$(find desktopApp/build/compose/binaries/main/msi -name '*.msi' -print -quit)
          if [ -z "$msi" ]; then
            echo "No se encontró ningún .msi." >&2
            exit 1
          fi
          appdir="desktopApp/build/compose/binaries/main/app/ImageWatch"
          if [ ! -d "$appdir" ]; then
            echo "No se encontró la carpeta app-image en $appdir." >&2
            exit 1
          fi
          zip="ImageWatch-${{ steps.decide.outputs.version }}-portable.zip"
          ( cd "$(dirname "$appdir")" && 7z a -tzip "$GITHUB_WORKSPACE/$zip" "ImageWatch" >/dev/null )
          echo "msi=$msi" >> "$GITHUB_OUTPUT"
          echo "zip=$zip" >> "$GITHUB_OUTPUT"

      - name: Firmar el MSI (solo si hay certificado configurado)
        if: ${{ steps.decide.outputs.release == 'true' && env.SIGN_PFX_BASE64 != '' }}
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'sign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe no encontrado en el Windows SDK.' }
          & $signtool.FullName sign /fd SHA256 /td SHA256 `
            /tr http://timestamp.sectigo.com `
            /f $pfx /p $env:SIGN_PFX_PASSWORD `
            '${{ steps.art.outputs.msi }}'

      - name: Calcular el checksum del MSI
        id: hash
        if: steps.decide.outputs.release == 'true'
        shell: pwsh
        # Después de firmar: firmar cambia los bytes del MSI, así que el hash sale del fichero
        # final. UpdateDownloader baja este `.sha256` y lo compara con lo que descarga.
        run: |
          $msi = '${{ steps.art.outputs.msi }}'
          $name = Split-Path $msi -Leaf
          $hash = (Get-FileHash $msi -Algorithm SHA256).Hash.ToLower()
          $out = "$msi.sha256"
          # Formato estilo `sha256sum`: "<hash>  <nombre>". Se lee el primer campo de 64 hex.
          "$hash  $name" | Set-Content -NoNewline -Path $out -Encoding ascii
          "sha256=$out" >> $env:GITHUB_OUTPUT

      - name: Publicar el Release con los tres artefactos
        if: steps.decide.outputs.release == 'true'
        shell: bash
        # `gh release create` crea el tag vX.Y.Z sobre este commit en el mismo paso. Solo se
        # llega aquí con MSI, portable y checksum ya construidos, verificados y -si hay
        # certificado- firmados: el tag y el Release nacen juntos o no nacen.
        run: |
          gh release create "v${{ steps.decide.outputs.version }}" \
            "${{ steps.art.outputs.msi }}" \
            "${{ steps.hash.outputs.sha256 }}" \
            "${{ steps.art.outputs.zip }}" \
            --target "$GITHUB_SHA" \
            --title "ImageWatch v${{ steps.decide.outputs.version }}" \
            --generate-notes
